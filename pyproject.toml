[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "signalbox-board"
dynamic = ["version", "readme"]
description = "The interlocking board for teams of humans and AI agents: GitHub Issues, git-ref locks and worktrees"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pmi97" }, { name = "XMihura", email = "kanvas@users.noreply.github.com" }]
requires-python = ">=3.8"
keywords = ["kanban", "tasks", "planning", "ai agents", "multi-agent", "git worktree", "github issues", "claude", "codex", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/pmi97/signalbox"
Changelog = "https://github.com/pmi97/signalbox/blob/main/CHANGELOG.md"
Upstream = "https://github.com/XMihura/Kanvas"

[project.scripts]
signalbox = "signalbox:main"
sbx = "signalbox:main"
kanvas = "kanvas_board:main"
kanvas-board = "kanvas_board:main"

[tool.hatch.version]
path = "signalbox.py"

# The README links to images and files in the repository by relative paths,
# which PyPI cannot resolve; its PyPI copy points them at GitHub's main branch.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI pages stay light when the reader's system is dark, so they get the dark logo only.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<source media="\(prefers-color-scheme: dark\)"[^>]*>\n'
replacement = ''

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(\]\(|src=")img/'
replacement = '\1https://raw.githubusercontent.com/pmi97/signalbox/main/img/'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)'
replacement = '](https://github.com/pmi97/signalbox/blob/main/'

# The wheel holds two packages: `kanvas_board`, the Kanvas engine and its page (also the plain `kanvas` command), and
# `signalbox`, which imports that engine and carries its skill and guard workflow next to itself.
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"kanvas.py" = "kanvas_board/__init__.py"
"kanvas.html" = "kanvas_board/kanvas.html"
"skill/SKILL.md" = "kanvas_board/SKILL.md"
"signalbox.py" = "signalbox/__init__.py"
"skill/signalbox/SKILL.md" = "signalbox/SKILL.md"
"templates/signalbox-guard.yml" = "signalbox/signalbox-guard.yml"

[tool.hatch.build.targets.sdist]
include = ["/signalbox.py", "/kanvas.py", "/kanvas.html", "/skill", "/templates", "/README.md", "/LICENSE", "/CHANGELOG.md"]
