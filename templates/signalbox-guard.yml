# Signalbox guard: GitHub knows who made each change to an issue, so this workflow turns the board's human-only
# decisions into rules. When an account that may not decide (an agent's bot account, or someone who is not an
# approver of the task's lane) approves a proposal, sends work back, accepts or rejects it, demotes it, turns YOLO on
# or removes a YOLO stop, takes a task off the board or puts approved work on it, or (for agent accounts) rewrites an
# approved task, the guard undoes it and says why in a comment. Approvers and agent accounts are read from
# .signalbox/config.json on the default branch, so a pull request cannot change them.
name: signalbox-guard

on:
  issues:
    types: [labeled, unlabeled, closed, edited]

permissions:
  issues: write
  contents: read

concurrency:
  group: signalbox-guard-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    # Also when the signalbox label itself goes, so taking a task off the board is seen too.
    if: contains(github.event.issue.labels.*.name, 'signalbox') || github.event.label.name == 'signalbox'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .signalbox
            .agents/skills/signalbox
      - name: Undo decisions made by accounts that may not make them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNALBOX_USER: github-actions
          SIGNALBOX_AGENT: signalbox-guard
        run: python3 .agents/skills/signalbox/signalbox.py guard --event "$GITHUB_EVENT_PATH"
