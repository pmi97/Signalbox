# Signalbox guard: GitHub knows who made each change to an issue, so this workflow turns the board's human-only
# decisions into rules. When an account that may not decide (an agent's bot account, or someone who is not an
# approver of the task's lane) approves a proposal, starts one, sends work back, accepts, rejects or reopens it,
# demotes it, moves it between lanes or changes its kind, turns YOLO on or removes a YOLO stop, takes a task off the
# board, or (for agent accounts) rewrites an approved task, the guard undoes it and says why in a comment.
# Approvers and agent accounts are read from .signalbox/config.json on the default branch, so a pull request cannot
# change them.
name: signalbox-guard

on:
  issues:
    types: [labeled, unlabeled, closed, reopened, edited]
  schedule:
    - cron: "23 * * * *"  # every hour: judge again what a failed or cancelled run left, and labels changed repository-wide

permissions:
  issues: write
  contents: read

# One run per issue at a time. GitHub may drop a waiting run when a newer one queues; that loses nothing, since
# every run replays the issue's whole history and judges each change by the rules in force when it was made.
# Edits get runs of their own that nothing cancels, since a description's history may not be readable later.
concurrency:
  group: signalbox-guard-${{ github.event.issue.number || 'sweep' }}-${{ github.event.action == 'edited' && github.run_id || 'labels' }}
  cancel-in-progress: false

jobs:
  guard:
    # Also when the signalbox label itself goes, so taking a task off the board is seen too.
    # Every issue event, whatever its labels: an issue taken off the board is still judged as the board issue it
    # was, and one that never was is left at once.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every workflow of a repository, on any branch, writes as github-actions[bot], and the guard trusts that
    # account's changes as its own corrections. Where agent accounts can push workflows, or workflows run pushed
    # code with a write token, give the guard its own account: an environment "signalbox-guard" that only the
    # default branch may use (Settings > Environments > Deployment branches), that account's token in it as
    # SIGNALBOX_GUARD_TOKEN, the next line uncommented, and the account under "guard": {"logins": [...]} in
    # .signalbox/config.json. See "Securing the guard" in Signalbox's README.
    # environment: signalbox-guard
    steps:
      # The whole history of the config, so each change is judged by the approvers of its day. Only this
      # repository's default branch runs here, so the read-only token may stay for git to fetch what it needs.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            .signalbox
            .agents/skills/signalbox
      - name: Undo decisions made by accounts that may not make them
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.SIGNALBOX_GUARD_TOKEN || secrets.GITHUB_TOKEN }}
          SIGNALBOX_USER: github-actions
          SIGNALBOX_AGENT: signalbox-guard
        run: python3 .agents/skills/signalbox/signalbox.py guard --event "$GITHUB_EVENT_PATH"
      - name: Sweep the board
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.SIGNALBOX_GUARD_TOKEN || secrets.GITHUB_TOKEN }}
          SIGNALBOX_USER: github-actions
          SIGNALBOX_AGENT: signalbox-guard
        run: python3 .agents/skills/signalbox/signalbox.py guard --sweep
